name: Apply portfolio offer v2
on:
  push:
    branches:
      - 'feat/portfolio-modal-offer'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'feat/portfolio-modal-offer'
      - name: Apply patch
        run: python .github/apply_offer_patch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add portfolio preview modal and promotional offer"
          git push origin HEAD:feat/portfolio-modal-offer
